# Test-only datasource override: points at a dedicated PostgreSQL test database so automated
# tests never touch the local development database. Requires PostgreSQL (same as production).
spring.datasource.url=${SAIDIKA_TEST_DB_URL:jdbc:postgresql://localhost:5432/saidika_test}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SAIDIKA_TEST_DB_USERNAME:saidika}
spring.datasource.password=${SAIDIKA_TEST_DB_PASSWORD:saidika_dev}

spring.jpa.hibernate.ddl-auto=create-drop

# This file replaces src/main/resources/application.properties entirely on the test classpath, so the
# Ollama/Qwen3 settings must be repeated here for the live *IT integration tests (normal ".\mvnw.cmd test"
# never calls the model, so this only matters when those *IT tests are run explicitly).
spring.ai.ollama.base-url=${SAIDIKA_OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${SAIDIKA_OLLAMA_MODEL:qwen3:4b}
spring.ai.ollama.init.pull-model-strategy=never
saidika.agent.classification-timeout-ms=${SAIDIKA_CLASSIFICATION_TIMEOUT_MS:20000}
