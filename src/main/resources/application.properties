spring.application.name=saidika
spring.datasource.url=jdbc:h2:mem:saidika;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Spring AI / Ollama LLM foundation (agent/tool-calling not yet implemented).
# Both values are externally configurable so the model/endpoint never need to be hardcoded in Java.
spring.ai.ollama.base-url=${SAIDIKA_OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.model=${SAIDIKA_OLLAMA_MODEL:qwen3:4b}
spring.ai.ollama.init.pull-model-strategy=never
