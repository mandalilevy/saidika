spring.application.name=saidika

# PostgreSQL is the only supported application datasource. Connection details are externalized
# via environment variables; the defaults below are local-development-only placeholders, never
# real credentials.
spring.datasource.url=${SAIDIKA_DB_URL:jdbc:postgresql://localhost:5432/saidika}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SAIDIKA_DB_USERNAME:saidika}
spring.datasource.password=${SAIDIKA_DB_PASSWORD:saidika_dev}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Spring AI / Ollama LLM foundation, used by the advanced agent (com.hackathon.saidika.agent).
# Both values are externally configurable so the model/endpoint never need to be hardcoded in Java.
spring.ai.ollama.base-url=${SAIDIKA_OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${SAIDIKA_OLLAMA_MODEL:qwen3:4b}
spring.ai.ollama.init.pull-model-strategy=never

# Upper bound on how long the agent waits for a classification response from Ollama before falling
# back to the deterministic baseline classifier; prevents an indefinitely hanging model call.
saidika.agent.classification-timeout-ms=${SAIDIKA_CLASSIFICATION_TIMEOUT_MS:20000}

# Public provider research (OpenStreetMap Nominatim reverse geocoding; free, no API key).
saidika.research.nominatim-base-url=${SAIDIKA_NOMINATIM_BASE_URL:https://nominatim.openstreetmap.org}
saidika.research.user-agent=${SAIDIKA_RESEARCH_USER_AGENT:Saidika-Hackathon-Agent/1.0 (educational, non-commercial)}
saidika.research.timeout-ms=${SAIDIKA_RESEARCH_TIMEOUT_MS:4000}

